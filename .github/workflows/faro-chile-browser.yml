name: FARO Chile browser regression
on:
  push:
    branches: [main]
    paths:
      - 'chile/**'
      - '.github/workflows/faro-chile-browser.yml'
  pull_request:
    paths:
      - 'chile/**'
      - '.github/workflows/faro-chile-browser.yml'
jobs:
  chile-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Use hosted Chrome with Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          google-chrome --version
      - name: Check Valparaíso UX, UTC, sources and overflow
        run: node chile/test-browser.cjs
      - name: Save FARO reading visuals for review
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: faro-reading-visual-regression
          path: artifacts/faro-reading/
          if-no-files-found: ignore
          retention-days: 14
