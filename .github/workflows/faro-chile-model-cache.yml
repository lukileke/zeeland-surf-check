name: FARO Chile · modelo de respaldo same-origin
# Live offshore forecasts are third-party models, not beach observations.
# Open-Meteo free API terms are for non-commercial use.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'chile/build-first-party-model.cjs'
      - '.github/workflows/faro-chile-model-cache.yml'
  schedule:
    - cron: '19 */2 * * *'
permissions:
  contents: write
concurrency:
  group: faro-chile-published-model
  cancel-in-progress: false
jobs:
  verified-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FARO_RESEARCH_NONCOMMERCIAL_ACK: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Capture 5 actual Open-Meteo pilot forecasts
        run: node chile/build-first-party-model.cjs
      - name: Publish same-origin model snapshot to Pages source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "faro-model-snapshot[bot]"
          git config user.email "faro-model-snapshot[bot]@users.noreply.github.com"
          git add chile/data/faro-model-snapshot.json
          if git diff --cached --quiet; then
            echo "No new model snapshot."
            exit 0
          fi
          git commit -m "data(chile): publish authentic model snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Keep diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: faro-model-capture-${{ github.run_id }}
          path: chile/data/faro-model-snapshot.json
          if-no-files-found: ignore
          retention-days: 3
